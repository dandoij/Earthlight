[project]
name = "earthlight"
version = "0.0.0"
description = "Where in the universe is the light from a given moment arriving right now?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
earthlight = "earthlight.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earthlight"]
