[project]
name = "earthlight-workspace"
version = "0.0.0"
description = "Workspace root for the Earthlight monorepo (not published)."
requires-python = ">=3.12"
dependencies = ["earthlight", "earthlight-pipeline"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/earthlight", "pipeline"]

[tool.uv.sources]
earthlight = { workspace = true }
earthlight-pipeline = { workspace = true }

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["packages", "pipeline"]
strict = ["packages/earthlight"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["packages/earthlight/tests", "pipeline/tests"]
addopts = "--import-mode=importlib"
