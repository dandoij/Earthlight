[project]
name = "earthlight-workspace"
version = "0.0.0"
description = "Workspace root for the Earthlight monorepo (not published)."
requires-python = ">=3.12"
dependencies = ["earthlight", "earthlight-pipeline"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/earthlight", "pipeline"]

[tool.uv.sources]
earthlight = { workspace = true }
earthlight-pipeline = { workspace = true }
