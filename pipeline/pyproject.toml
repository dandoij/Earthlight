[project]
name = "earthlight-pipeline"
version = "0.0.0"
description = "Data build pipeline for Earthlight (never shipped)."
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.2",
    "astroquery>=0.4.11",
    "earthlight",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "typer>=0.27.3",
]

[project.scripts]
earthlight-build = "earthlight_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earthlight_pipeline"]

[tool.uv.sources]
earthlight = { workspace = true }
