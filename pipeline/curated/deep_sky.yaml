# Curated deep-sky objects: the far ones, whose distance comes from a redshift.
#
# This file holds names and editorial choices only. It never holds a lookback or a distance:
#   simbad:  the object's identifier in SIMBAD, which supplies position and redshift.
#   inline:  a redshift typed here for an object SIMBAD does not hold, with the URL of the
#            paper it came from. `error` is one standard deviation, in redshift.
# Give exactly one of the two. fame is 1 (known to enthusiasts) to 5 (a household name).
# wikipedia is the exact article title, used to fetch an image.
#
# Objects nearer than redshift 0.01 (about 130 million light-years) are not here: their
# redshift is mostly their own motion, so they need measured distances (step 2.6b).

