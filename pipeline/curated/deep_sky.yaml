# Curated deep-sky objects: the far ones, whose distance comes from a redshift.
#
# This file holds names and editorial choices only. It never holds a lookback or a distance:
#   simbad:  the object's identifier in SIMBAD, which supplies position and redshift.
#   inline:  a redshift typed here for an object SIMBAD does not hold, with the URL of the
#            paper it came from. `error` is one standard deviation, in redshift.
#   distance: for star clusters and nearby galaxies, which catalogue and the object's name
#            in it (hunt_reffert_2023, mcconnachie_2012, or cosmicflows_4, all on VizieR).
#            Position and distance come from there.
# Give exactly one of the three. fame is 1 (known to enthusiasts) to 5 (a household name).
# wikipedia is the exact article title, used to fetch an image.
#
# Objects nearer than redshift 0.01 (about 130 million light-years) cannot use a redshift: it is
# mostly their own motion. Star clusters (step 2.6b) and nearby galaxies (step 2.6c) take a
# catalogue distance instead.

