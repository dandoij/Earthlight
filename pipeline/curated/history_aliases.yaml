# Other names people use for the history entries, so that search finds "fall of rome" or
# "moon landing" even though the entry is titled differently.
#
# The key is the id of an event, period, or landmark in curated/history/. Each alias is plain
# ASCII text (no accents: SQLite folds case for ASCII only). An alias is used by search and
# nothing else, so it is not a claim about the entry: it only has to be a name people type.
# An alias must not repeat across entries, and must not be the entry's own name.

